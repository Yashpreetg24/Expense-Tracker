services:
  - type: web
    name: expense-tracker-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  - type: web
    name: expense-tracker-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: expense-tracker-backend
          property: host
        value: https://${expense-tracker-backend.host}/api

databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_admin
